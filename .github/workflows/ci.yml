name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**', 'refactor/**']
  pull_request:

permissions:
  contents: read

jobs:
  linux-core-and-desktop:
    name: Linux full validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Core package
        run: python -m pip install --upgrade pip build && python -m pip install --no-deps .
      - name: CLI smoke test
        run: quattro-agent --help && quattro-agent --version
      - name: Existing and architecture tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build distributions
        run: python -m build
      - name: Compile Python
        run: python -m compileall -q src scripts
      - name: Python static hygiene
        run: python scripts/check_python.py
      - name: Public artifact policy
        run: python scripts/check_public_artifacts.py
      - name: Public history policy
        run: python scripts/check_public_history.py
      - name: Diff and documentation hygiene
        run: git diff --check && test -s README.md && test -s LICENSE && test -s SECURITY.md

  windows-core:
    name: Windows Core (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Core package
        run: python -m pip install --upgrade pip && python -m pip install --no-deps .
      - name: Import and CLI startup
        run: python -c "import quattro, quattro.core, quattro_agent; print('imports-ok')" && quattro-agent --help && quattro-agent --version
      - name: Core architecture and portable feature tests
        shell: pwsh
        run: |
          python -m unittest `
            tests.test_core_desktop_boundary `
            tests.test_public_portability `
            tests.test_delegation_classifier `
            tests.test_routing `
            tests.test_session_durability `
            tests.test_harness_core `
            tests.test_retrieval
      - name: Compile Core
        run: python -m compileall -q src/quattro src/quattro_agent src/quattro_harness.py src/quattro_deployment.py src/quattro_release.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './src'
          severity: warning
      - name: Check installer
        run: shellcheck install.sh
