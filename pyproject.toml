[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quattro-intelligence-core"
version = "1.0.0"
description = "Local project knowledge retrieval and explicit memory"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quattro contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
quattro-intelligence = "quattro_core.cli:main"
quattro-intelligence-mcp = "quattro_intelligence_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["quattro_core"]
py-modules = ["quattro_intelligence_mcp"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
