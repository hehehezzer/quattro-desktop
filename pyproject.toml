[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quattro-agent"
version = "0.1.0"
description = "A local-first, durable orchestration control plane for Codex and Pi"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quattro contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
quattro-agent = "quattro_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "quattro_deployment",
  "quattro_harness",
  "quattro_image_mcp",
  "quattro_memory",
  "quattro_pr_review",
  "quattro_release",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["quattro_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
